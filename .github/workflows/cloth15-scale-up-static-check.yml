name: Cloth15 scale-up checks

on:
  pull_request:
    paths:
      - "cloth_15x15_500step_project_scale_up/**"
      - ".github/workflows/cloth15-scale-up-static-check.yml"
  push:
    branches:
      - "feat/cloth15-scale-up-catalogue"
    paths:
      - "cloth_15x15_500step_project_scale_up/**"
      - ".github/workflows/cloth15-scale-up-static-check.yml"

jobs:
  catalogue-physics-and-pool:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile scale-up project
        run: python -m compileall -q cloth_15x15_500step_project_scale_up
      - name: Check command line entries
        working-directory: cloth_15x15_500step_project_scale_up
        run: |
          python cloth05_train_scale_up.py --help > /dev/null
          python cloth06_probe_memory_and_throughput.py --help > /dev/null
          python cloth07_evaluate_best_checkpoint.py --help > /dev/null
          python cloth08_run_end_to_end.py --help > /dev/null
      - name: Run catalogue physics pool and evaluation tests
        working-directory: cloth_15x15_500step_project_scale_up
        run: >-
          python -m unittest -v
          test_scenario_catalogue.py
          test_batched_physics.py
          test_training_pool.py
          test_final_evaluation.py
      - name: Run CPU memory probe smoke test
        working-directory: cloth_15x15_500step_project_scale_up
        run: |
          rm -rf /tmp/cloth15-memory-probe
          python cloth06_probe_memory_and_throughput.py \
            --device cpu \
            --catalogue c1 \
            --pool-size 8 \
            --batch-sizes 4 \
            --k-buckets 1 3 10 30 \
            --warmup-updates 0 \
            --measured-updates 1 \
            --width 16 \
            --output-dir /tmp/cloth15-memory-probe
          python -c "import json, pathlib; root=pathlib.Path('/tmp/cloth15-memory-probe'); data=json.loads((root/'memory_probe.json').read_text()); rec=json.loads((root/'recommended_training_config.json').read_text()); assert data['results'][0]['status']=='success'; assert rec['recommended_batch_size']==4"
      - name: Run end-to-end dry-run smoke test
        working-directory: cloth_15x15_500step_project_scale_up
        run: |
          rm -rf /tmp/cloth15-pipeline-dry-run
          python cloth08_run_end_to_end.py \
            --root /tmp/cloth15-pipeline-dry-run \
            --device cpu \
            --dry-run \
            --memory-batch-sizes 4 \
            --pool-size 8 \
            --training-batch-size 4 \
            --memory-warmup-updates 0 \
            --memory-measured-updates 1 \
            --evaluation-frames 1 \
            --inner-steps 1
          python -c "import json, pathlib; p=pathlib.Path('/tmp/cloth15-pipeline-dry-run/pipeline_state.json'); data=json.loads(p.read_text()); assert data['steps']=={'memory_probe':'planned','training':'planned','final_evaluation':'planned'}"
      - name: Run full in-memory audit
        working-directory: cloth_15x15_500step_project_scale_up
        run: python cloth01_build_scenario_catalogue.py --audit-only
