name: Retest 5x5 cloth scale-up project

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloth-5x5-scale-up
          fetch-depth: 0

      - name: Install CPU test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run complete project tests with local imports
        id: tests
        shell: bash
        run: |
          set +e
          cd cloth_5x5_500step_project_scale_up
          PYTHONPATH="$PWD" pytest -q > TEST_RESULTS.txt 2>&1
          status=$?
          cat TEST_RESULTS.txt
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            rm -f TEST_RESULTS.txt
          fi
          exit 0

      - name: Commit cleanup or failure report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent_retest_cloth_5x5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A cloth_5x5_500step_project_scale_up .github/workflows/agent_retest_cloth_5x5.yml
          git commit -m 'validate 5x5 project test suite'
          git push origin HEAD:agent/cloth-5x5-scale-up

      - name: Enforce test success
        shell: bash
        run: |
          test "${{ steps.tests.outputs.exit_status }}" -eq 0
