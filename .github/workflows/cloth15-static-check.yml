name: Cloth15 static checks

on:
  pull_request:
    paths:
      - "cloth_15x15_500step_project/**"
      - ".github/workflows/cloth15-static-check.yml"
  push:
    branches:
      - "feat/cloth-15x15-500step-project"
    paths:
      - "cloth_15x15_500step_project/**"
      - ".github/workflows/cloth15-static-check.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Cloth15 scripts
        run: python -m compileall -q cloth_15x15_500step_project
      - name: Parse all Python files with AST
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path("cloth_15x15_500step_project")
          files = sorted(root.glob("*.py"))
          if not files:
              raise SystemExit("No Cloth15 Python files found")
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(files)} Python files successfully")
          PY
